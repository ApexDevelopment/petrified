[package]
name = "petrified"
version = "0.1.1"
edition = "2024"
description = "A Rust port of Ironwood, the routing protocol behind Yggdrasil"
license = "MPL-2.0"
repository = "https://github.com/ApexDevelopment/petrified"
readme = "README.md"
keywords = ["ironwood", "yggdrasil", "mesh", "routing", "no-std"]
categories = ["network-programming", "no-std"]

[dependencies]
curve25519-dalek = { version = "5.0.0", default-features = false, features = ["zeroize"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["zeroize"] }
getrandom = { version = "0.4.3", optional = true }
poly1305 = { version = "0.9.1", default-features = false }
salsa20 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.1", default-features = false }

[features]
default = ["std", "fast"]
std = ["dep:getrandom"]
# Precomputed tables: faster signing and key generation, at the cost of flash
fast = ["ed25519-dalek/fast", "curve25519-dalek/precomputed-tables"]

[dev-dependencies]
hex = "0.4.3"
serde_json = "1.0.154"
